name: Candidate obstacle barrier controller physics audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/barrier_validation.py'
      - '.github/workflows/barrier-validation.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-barrier-validation
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install MuJoCo engine
        run: python -m pip install mujoco==3.3.2
      - name: Validate exact broadphase obstacle clearance
        run: python -m unittest mujoco_sim.test_clearance_grid -v
      - name: Test physical distance-barrier controller at 20 wind levels
        run: python -m experiments.barrier_validation
      - name: Publish all candidate failures and passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/barrier-results.tgz results/barrier_guard
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/barrier-results.tgz
            git add results/barrier_guard
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: CBF-inspired obstacle-distance safety guard validation [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: barrier-controller-research-validation
          path: results/barrier_guard/*
