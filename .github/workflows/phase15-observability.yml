name: Phase 15 LiDAR observability audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/lidar_observability.py'
      - 'tests/test_lidar_observability.py'
      - 'experiments/phase15_observability_dev.py'
      - '.github/workflows/phase15-observability.yml'
  pull_request:
    paths:
      - 'mars_lora/lidar_observability.py'
      - 'tests/test_lidar_observability.py'
      - 'experiments/phase15_observability_dev.py'
      - '.github/workflows/phase15-observability.yml'
permissions:
  contents: read
jobs:
  geometry-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 mujoco==3.3.2
      - name: LiDAR geometry diagnostics tests
        run: python -m unittest discover -s tests -p 'test_lidar_observability.py' -v
      - name: Passive native MuJoCo observability replay
        run: python -m experiments.phase15_observability_dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase15-native-observability-timelines
          path: results/phase15_observability_dev/*
