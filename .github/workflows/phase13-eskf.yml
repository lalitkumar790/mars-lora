name: Phase 13 ESKF consistency and outlier study
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mars_lora/lidar_imu_eskf.py'
      - 'tests/test_lidar_imu_eskf.py'
      - 'experiments/phase13_eskf_development.py'
      - '.github/workflows/phase13-eskf.yml'
  push:
    paths:
      - 'mars_lora/lidar_imu_eskf.py'
      - 'tests/test_lidar_imu_eskf.py'
      - 'experiments/phase13_eskf_development.py'
      - '.github/workflows/phase13-eskf.yml'
permissions:
  contents: read
jobs:
  paired-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: ESKF propagation, covariance and gate unit tests
        run: python -m unittest discover -s tests -p 'test_lidar_imu_eskf.py' -v
      - name: Frozen-in-script synthetic sensor development comparison
        run: python -m experiments.phase13_eskf_development --output results/phase13_eskf_development
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase13-eskf-consistency-development
          path: results/phase13_eskf_development/*
