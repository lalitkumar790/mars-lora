name: Phase 9 elevation staged route diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mars_lora/transit_route.py'
      - 'tests/test_transit_route.py'
      - 'experiments/phase9_staged_transit.py'
      - '.github/workflows/phase9-staged-transit.yml'
  push:
    paths:
      - 'mars_lora/transit_route.py'
      - 'tests/test_transit_route.py'
      - 'experiments/phase9_staged_transit.py'
      - '.github/workflows/phase9-staged-transit.yml'
permissions:
  contents: read
jobs:
  altitude-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_transit_route.py' -v
      - run: python -m pip install mujoco==3.3.2
      - run: python -m experiments.phase9_staged_transit --output results/phase9_staged_transit_dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase9-staged-transit-dev
          path: results/phase9_staged_transit_dev/*
