name: Phase 17c selected development viewpoint flight
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase17c_selected_detour_dev.py'
      - '.github/workflows/phase17c-selected-detour.yml'
  pull_request:
    paths:
      - 'experiments/phase17c_selected_detour_dev.py'
      - '.github/workflows/phase17c-selected-detour.yml'
permissions:
  contents: read
jobs:
  selected-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 mujoco==3.3.2
      - run: python -m unittest discover -s tests -p 'test_active_viewpoint.py' -v
      - run: python -m experiments.phase17c_selected_detour_dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase17c-selected-development-flight
          path: results/phase17c_selected_detour_dev/*
