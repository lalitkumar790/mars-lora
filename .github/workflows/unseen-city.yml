name: Pre-registered unseen-city safety and joint LoRa research evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/unseen_city_validation.py'
      - 'tests/test_unseen_city.py'
      - '.github/workflows/unseen-city.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-unseen-city-evaluation
  cancel-in-progress: true
jobs:
  heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native physics engine
        run: python -m pip install mujoco==3.3.2
      - name: Test frozen map seeds, A* uncertainty clearance and ex-ante decisions
        run: python -m unittest tests.test_unseen_city mujoco_sim.test_clearance_grid -v
      - name: Execute both airframes through two unseen cities and matched spatial LoRa trials
        run: python -m experiments.unseen_city_validation
      - name: Publish every planning and flight failure alongside radio outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/unseen-city-results.tgz results/unseen_city
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/unseen-city-results.tgz
            git add results/unseen_city
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: frozen unseen-city MuJoCo safety and deadline-energy-aware LoRa research [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unseen-city-physics-radio-evaluation
          path: results/unseen_city/*
