name: Native UAV wind and obstacle-safety sweep
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/wind_robustness.py'
      - 'mujoco_sim/validate_mission.py'
      - 'mujoco_sim/test_clearance_grid.py'
      - '.github/workflows/wind-robustness.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-wind-robustness
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native MuJoCo
        run: python -m pip install mujoco==3.3.2
      - name: Verify full-city collision broadphase exactly near obstacles
        run: python -m unittest mujoco_sim.test_clearance_grid -v
      - name: Execute 60 legacy, high-authority and integral-guard wind cases
        run: python -m experiments.wind_robustness --routes results/rf_navigation/routes.json --output results/wind_robustness
      - name: Publish safety sweep including negative results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/wind_robustness
          if ! git diff --cached --quiet; then
            git commit -m 'results: sixty native MuJoCo controller wind and full-city safety checks [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*2))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-uav-wind-validation
          path: results/wind_robustness/*
