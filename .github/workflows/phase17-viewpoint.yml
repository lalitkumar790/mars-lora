name: Phase 17 active-observability viewpoint development
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/active_viewpoint.py'
      - 'tests/test_active_viewpoint.py'
      - 'experiments/phase17_active_viewpoint_dev.py'
      - '.github/workflows/phase17-viewpoint.yml'
  pull_request:
    paths:
      - 'mars_lora/active_viewpoint.py'
      - 'tests/test_active_viewpoint.py'
      - 'experiments/phase17_active_viewpoint_dev.py'
      - '.github/workflows/phase17-viewpoint.yml'
permissions:
  contents: read
jobs:
  viewpoint-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 mujoco==3.3.2
      - name: Check route safety, no-gain fallback and timed constraints
        run: python -m unittest discover -s tests -p 'test_active_viewpoint.py' -v
      - name: Paired native development missions and full failure denominator
        run: python -m experiments.phase17_active_viewpoint_dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase17-observability-route-dev
          path: results/phase17_active_viewpoint_dev/*
