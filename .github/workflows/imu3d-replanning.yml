name: 3D LiDAR IMU replanning and new-city flight validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/lidar_imu3d.py'
      - 'mujoco_sim/validate_mission.py'
      - 'tests/test_lidar_imu3d.py'
      - 'experiments/imu3d_replanning_audit.py'
      - '.github/workflows/imu3d-replanning.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-imu3d-replan
  cancel-in-progress: true
jobs:
  native-imu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install MuJoCo native physics
        run: python -m pip install mujoco==3.3.2
      - name: Verify 3D LiDAR geometry, pose registration and inertial prediction
        run: python -m unittest tests.test_lidar_imu3d -v
      - name: Execute new-city physics trajectories with localization and uncertainty replans
        run: python -m experiments.imu3d_replanning_audit --output results/imu3d_replanning_v2
      - name: Publish both successes and negative results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/imu3d-results.tgz results/imu3d_replanning_v2
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/imu3d-results.tgz
            git add results/imu3d_replanning_v2
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: independent-city 3D LiDAR IMU and uncertainty A-star validation [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-3d-imu-replanning-study
          path: results/imu3d_replanning_v2/*
