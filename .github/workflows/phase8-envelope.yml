name: Phase 8 conservative stopping-envelope audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mars_lora/replan_envelope.py'
      - 'mujoco_sim/validate_mission.py'
      - 'tests/test_replan_envelope.py'
      - 'experiments/phase8_envelope.py'
      - '.github/workflows/phase8-envelope.yml'
  push:
    paths:
      - 'mars_lora/replan_envelope.py'
      - 'mujoco_sim/validate_mission.py'
      - 'tests/test_replan_envelope.py'
      - 'experiments/phase8_envelope.py'
      - '.github/workflows/phase8-envelope.yml'
permissions:
  contents: read
jobs:
  development-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check invariant tests
        run: python -m unittest discover -s tests -p 'test_replan_envelope.py' -v
      - name: Install pinned MuJoCo
        run: python -m pip install mujoco==3.3.2
      - name: Compare frozen V5 with opt-in envelope on development cities
        run: python -m experiments.phase8_envelope --city-seeds 91311 20483 --output results/phase8_envelope_dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase8-development-native-flights
          path: results/phase8_envelope_dev/*
