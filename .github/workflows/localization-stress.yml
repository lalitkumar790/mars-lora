name: Native GPS-denied pose-estimate drift sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/localization_stress.py'
      - 'tests/test_localization_stress.py'
      - '.github/workflows/localization-stress.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-localization-stress
  cancel-in-progress: true
jobs:
  localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native MuJoCo
        run: python -m pip install mujoco==3.3.2
      - name: Verify noisy localization feedback is deterministic
        run: python -m unittest tests.test_localization_stress mujoco_sim.test_clearance_grid -v
      - name: Run 32 physically executed urban pose-drift stress cases
        run: python -m experiments.localization_stress
      - name: Publish all successes and failures without changing tested data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/localization-stress.tgz results/localization_stress
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/localization-stress.tgz
            git add results/localization_stress
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: native UAV localization drift ATE and safety tradeoff [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physically-executed-localization-sensitivity
          path: results/localization_stress/*
