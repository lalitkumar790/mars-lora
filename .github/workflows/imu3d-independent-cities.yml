name: Frozen 3D LiDAR IMU holdout in additional urban scenes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/imu3d-independent-cities.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-imu3d-independent-cities
  cancel-in-progress: true
jobs:
  heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native MuJoCo
        run: python -m pip install mujoco==3.3.2
      - name: Check frozen 3D LiDAR IMU estimator invariants
        run: python -m unittest tests.test_lidar_imu3d -v
      - name: Evaluate exact frozen V5 settings on new unseen seeds
        run: python -m experiments.imu3d_replanning_audit --hybrid --city-seeds 73571 18931 --output results/imu3d_independent_cities
      - name: Publish field-free independent-city safety failures without suppression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/imu3d-holdout.tgz results/imu3d_independent_cities
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/imu3d-holdout.tgz
            git add results/imu3d_independent_cities
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: frozen 3D LIO safety evaluation on two additional urban seeds [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-imu3d-heldout-native-flight-audit
          path: results/imu3d_independent_cities/*
