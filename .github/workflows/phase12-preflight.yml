name: Phase 12 preflight constraint diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/trajectory_dynamics.py'
      - '.github/workflows/phase12-preflight.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_trajectory_dynamics.py' -v
      - name: Determine reasons for rejected trajectories
        run: |
          python - <<'PY'
          from mars_lora.rf_astar import INDUSTRIAL
          from mars_lora.urban_scene import city
          from mars_lora.trajectory_dynamics import build_trajectory
          for seed in [48221,63047]:
              solids=INDUSTRIAL+tuple(city(seed))
              for method in ('shortest','rf_aware'):
                  try:
                      p=build_trajectory(method,solids)
                      print('PASS',seed,method,len(p.points),p.arrival_times_s[-1],flush=True)
                  except Exception as exc:
                      print('REJECT',seed,method,str(exc),flush=True)
          PY
