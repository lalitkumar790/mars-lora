name: Physics-to-LoRa cross-layer experiments
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/replay_mujoco_radio.py'
      - 'mujoco_sim/validate_mission.py'
      - 'public/quad.xml'
      - 'public/crazyflie.xml'
      - '.github/workflows/crosslayer.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-crosslayer-publish
  cancel-in-progress: true
jobs:
  physics-radio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install MuJoCo
        run: python -m pip install mujoco==3.3.2
      - name: Install plotting dependency
        run: python -m pip install matplotlib==3.10.3
      - name: Generate validated native MuJoCo trajectory
        run: python mujoco_sim/validate_mission.py --output results/flight-validation
      - name: Execute 480 controlled physics-to-LoRa replays
        run: python -m experiments.replay_mujoco_radio --flight results/flight-validation --output results/crosslayer --seeds 20
      - name: Render research figures from saved trial results
        run: python analysis/plot_crosslayer.py --summary results/crosslayer/summary.csv --output paper/figures/crosslayer_policies.pdf
      - name: Commit results only to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/crosslayer-published.tgz results/flight-validation results/crosslayer paper/figures/crosslayer_policies.pdf paper/figures/crosslayer_policies.png
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/crosslayer-published.tgz
            git add results/flight-validation results/crosslayer paper/figures/crosslayer_policies.pdf paper/figures/crosslayer_policies.png
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: MuJoCo 3D flight coupled to 480 seeded LoRa network trials [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physics-to-lora-research-results
          path: |
            results/flight-validation/*
            results/crosslayer/*
            paper/figures/crosslayer_policies.pdf
            paper/figures/crosslayer_policies.png
