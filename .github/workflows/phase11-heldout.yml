name: Phase 11 frozen new-city safety holdout
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/phase11_frozen_holdout.py'
      - '.github/workflows/phase11-heldout.yml'
  push:
    paths:
      - 'experiments/phase11_frozen_holdout.py'
      - '.github/workflows/phase11-heldout.yml'
permissions:
  contents: read
jobs:
  frozen-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_transit_route.py' -v
      - run: python -m pip install mujoco==3.3.2
      - run: python -m experiments.phase11_frozen_holdout --output results/phase11_heldout_frozen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase11-frozen-unseen-city-flights
          path: results/phase11_heldout_frozen/*
