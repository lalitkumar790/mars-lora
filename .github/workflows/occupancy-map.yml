name: Occupancy map regression and dashboard build
on:
  push:
    paths:
      - 'public/src/slam.js'
      - 'public/src/main.js'
      - 'public/index.html'
      - 'public/tests/slam-growth.test.mjs'
      - '.github/workflows/occupancy-map.yml'
  pull_request:
    paths:
      - 'public/src/slam.js'
      - 'public/src/main.js'
      - 'public/index.html'
      - 'public/tests/slam-growth.test.mjs'
      - '.github/workflows/occupancy-map.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: public/package-lock.json
      - run: node --test tests/slam-growth.test.mjs
        working-directory: public
      - run: npm ci
        working-directory: public
      - run: npm run build
        working-directory: public
