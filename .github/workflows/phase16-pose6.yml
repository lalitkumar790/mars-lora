name: Phase 16 six-DoF LiDAR observability research
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/lidar_pose6_observability.py'
      - 'tests/test_lidar_pose6_observability.py'
      - 'experiments/phase16_pose6_dev.py'
      - '.github/workflows/phase16-pose6.yml'
  pull_request:
    paths:
      - 'mars_lora/lidar_pose6_observability.py'
      - 'tests/test_lidar_pose6_observability.py'
      - 'experiments/phase16_pose6_dev.py'
      - '.github/workflows/phase16-pose6.yml'
permissions:
  contents: read
jobs:
  pose6-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 mujoco==3.3.2
      - name: Local 6D ray geometry and finite difference tests
        run: python -m unittest discover -s tests -p 'test_lidar_pose6_observability.py' -v
      - name: Native matched development flights with body-fixed scan shadow
        run: python -m experiments.phase16_pose6_dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase16-pose6-scan-timelines
          path: results/phase16_pose6_dev/*
