name: Native map-aided LiDAR localization and flight safety audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/lidar_map_matching.py'
      - 'tests/test_lidar_map_matching.py'
      - 'experiments/lidar_map_matching_audit.py'
      - '.github/workflows/lidar-map-matching.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-lidar-map-matching
  cancel-in-progress: true
jobs:
  localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native MuJoCo
        run: python -m pip install mujoco==3.3.2
      - name: Verify 2D LiDAR range geometry and deterministic scan matching
        run: python -m unittest tests.test_lidar_map_matching tests.test_localization_stress -v
      - name: Execute sixteen native physical mission comparisons
        run: python -m experiments.lidar_map_matching_audit
      - name: Publish matched localization ATE and safety outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/lidar-matching.tgz results/lidar_map_matching
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/lidar-matching.tgz
            git add results/lidar_map_matching
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: matched map-aided 2D lidar GPS-free localization physics safety audit [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lidar-map-matching-physical-flight-safety
          path: results/lidar_map_matching/*
