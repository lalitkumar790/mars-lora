name: Phase 12 dynamic trajectory development
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/trajectory_dynamics.py'
      - 'mujoco_sim/validate_mission.py'
      - 'tests/test_trajectory_dynamics.py'
      - 'experiments/phase12_dynamic_development.py'
      - '.github/workflows/phase12-dynamic.yml'
  pull_request:
    paths:
      - 'mars_lora/trajectory_dynamics.py'
      - 'mujoco_sim/validate_mission.py'
      - 'tests/test_trajectory_dynamics.py'
      - 'experiments/phase12_dynamic_development.py'
      - '.github/workflows/phase12-dynamic.yml'
permissions:
  contents: read
jobs:
  native-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate exact endpoints and dynamic speed envelopes
        run: python -m unittest discover -s tests -p 'test_trajectory_dynamics.py' -v
      - run: python -m pip install mujoco==3.3.2
      - name: MuJoCo paired trials on development cities only
        run: python -m experiments.phase12_dynamic_development --output results/phase12_dynamic_development
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase12-dynamic-development-traces
          path: results/phase12_dynamic_development/*
