name: Browser MuJoCo flight controls
on:
  workflow_dispatch:
  push:
    paths:
      - 'public/**'
      - '.github/workflows/browser-flight.yml'
permissions:
  contents: read
jobs:
  browser-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser simulator and Chromium
        run: |
          cd public
          npm install
          npx playwright install --with-deps chromium
      - name: Validate Vite production bundle
        run: cd public && npm run build
      - name: Start site and exercise flight controls
        run: |
          cd public
          npm run dev -- --host 127.0.0.1 > /tmp/mars-vite.log 2>&1 &
          sleep 3
          npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-simulator-failure
          path: public/browser-failure.png
