name: Phase 12 first-contact causal diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase12_contact_causality.py'
      - '.github/workflows/phase12-contact-causality.yml'
  pull_request:
    paths:
      - 'experiments/phase12_contact_causality.py'
      - '.github/workflows/phase12-contact-causality.yml'
permissions:
  contents: read
jobs:
  matched-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install mujoco==3.3.2
      - run: python -m experiments.phase12_contact_causality
      - name: Measure false-confidence alarms on safe development cases
        run: python -m experiments.phase12_confidence_specificity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase12-first-contact-causes
          path: |
            results/phase12b_contact_causality/*
            results/phase12_confidence_specificity_dev/*
