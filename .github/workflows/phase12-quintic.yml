name: Phase 12 quintic reference native smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase12_quintic_smoke.py'
      - 'mars_lora/kinodynamic_reference.py'
      - '.github/workflows/phase12-quintic.yml'
  pull_request:
    paths:
      - 'experiments/phase12_quintic_smoke.py'
      - 'mars_lora/kinodynamic_reference.py'
      - '.github/workflows/phase12-quintic.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify analytic kinematic constraints
        run: python -m unittest discover -s tests -p 'test_kinodynamic_reference.py' -v
      - run: python -m pip install mujoco==3.3.2
      - run: python -m experiments.phase12_quintic_smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase12-quintic-native-smoke
          path: results/phase12_quintic_tracking_smoke/*
