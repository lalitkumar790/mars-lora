name: Phase 13 native ESKF shadow audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase13_native_eskf_shadow.py'
      - '.github/workflows/phase13-native-shadow.yml'
  pull_request:
    paths:
      - 'experiments/phase13_native_eskf_shadow.py'
      - '.github/workflows/phase13-native-shadow.yml'
permissions:
  contents: read
jobs:
  native-eskf-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install MuJoCo (numpy dependency)
        run: python -m pip install mujoco==3.3.2 numpy==2.2.6
      - name: ESKF covariance consistency tests
        run: python -m unittest discover -s tests -p 'test_lidar_imu_eskf.py' -v
      - name: Native physical flight estimator shadow comparison
        run: python -m experiments.phase13_native_eskf_shadow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase13-native-shadow-flight-logs
          path: results/phase13_native_eskf_shadow/*
