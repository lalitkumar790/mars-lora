name: Phase 14 body-frame 15-state ESKF verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/body_imu_eskf15.py'
      - 'mars_lora/body_imu_surrogate.py'
      - 'tests/test_body_imu_eskf15.py'
      - 'experiments/phase14_body_imu_shadow.py'
      - '.github/workflows/phase14-body-eskf.yml'
  pull_request:
    paths:
      - 'mars_lora/body_imu_eskf15.py'
      - 'mars_lora/body_imu_surrogate.py'
      - 'tests/test_body_imu_eskf15.py'
      - 'experiments/phase14_body_imu_shadow.py'
      - '.github/workflows/phase14-body-eskf.yml'
permissions:
  contents: read
jobs:
  validate-filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 mujoco==3.3.2
      - name: Body-frame IMU and ESKF mathematical tests
        run: python -m unittest discover -s tests -p 'test_body_imu_eskf15.py' -v
      - name: Paired native MuJoCo shadow audit
        run: python -m experiments.phase14_body_imu_shadow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase14-body-imu-native-shadow
          path: results/phase14_body_imu_shadow/*
