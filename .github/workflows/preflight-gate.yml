name: Exploratory preflight route decision audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'mars_lora/route_gate.py'
      - 'analysis/preflight_gate_audit.py'
      - 'tests/test_route_gate.py'
      - '.github/workflows/preflight-gate.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-preflight-gate
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Unit-test observable-only preflight decision
        run: python -m unittest tests.test_route_gate -v
      - name: Evaluate gate without using future packet outcomes
        run: python -m analysis.preflight_gate_audit --input results/heldout_validation/trials.csv --output results/preflight_gate
      - name: Publish all exploratory gate results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/preflight_gate
          if ! git diff --cached --quiet; then
            git commit -m 'results: exploratory observable preflight route gate [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*2))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exploratory-preflight-route-selection
          path: results/preflight_gate/*
