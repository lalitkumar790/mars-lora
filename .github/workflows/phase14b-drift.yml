name: Phase 14b body-IMU divergence diagnosis
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase14b_drift_diagnosis.py'
      - '.github/workflows/phase14b-drift.yml'
  pull_request:
    paths:
      - 'experiments/phase14b_drift_diagnosis.py'
      - '.github/workflows/phase14b-drift.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 mujoco==3.3.2
      - run: python -m unittest discover -s tests -p 'test_body_imu_eskf15.py' -v
      - run: python -m experiments.phase14b_drift_diagnosis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase14b-drift-diagnostic
          path: results/phase14b_drift_diagnosis/*
