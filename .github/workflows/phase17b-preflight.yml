name: Phase 17b viewpoint preflight rejection diagnosis
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase17b_preflight.py'
      - '.github/workflows/phase17b-preflight.yml'
  pull_request:
    paths:
      - 'experiments/phase17b_preflight.py'
      - '.github/workflows/phase17b-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s tests -p 'test_active_viewpoint.py' -v
      - run: python -m experiments.phase17b_preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase17b-viewpoint-rejection-diagnostics
          path: results/phase17b_preflight/*
