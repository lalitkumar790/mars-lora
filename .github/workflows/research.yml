name: Reproduce simulation and compile paper
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mars_lora/**'
      - 'experiments/**'
      - 'tests/**'
      - 'analysis/**'
      - 'paper/paper.tex'
      - 'paper/figures/heldout_robustness.pdf'
      - '.github/workflows/research.yml'
concurrency:
  group: mars-lora-publish-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python figure dependencies
        run: python -m pip install matplotlib==3.10.3
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute seeded trials
        run: python -m experiments.run --output results/raw --seeds 20
      - name: Render charts from data
        run: python analysis/plot_results.py --input results/raw/summary.csv --output paper/figures --dashboard results/dashboard-generated
      - name: Install manuscript build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-recommended texlive-publishers poppler-utils
      - name: Compile and enforce eight-page manuscript
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error paper.tex
          pages=$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')
          echo "Manuscript page count including references: $pages"
          test "$pages" -le 8
      - name: Commit verified output back to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve the complete generated outputs before re-basing on the
          # newest default branch; binary PDFs cannot be three-way merged.
          tar -czf /tmp/mars-lora-generated-output.tgz results/raw paper/figures paper/paper.pdf
          source_revision=$(git rev-parse HEAD:paper/paper.tex)
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            newest_revision=$(git rev-parse origin/main:paper/paper.tex)
            if [ "$source_revision" != "$newest_revision" ]; then
              echo "Paper source changed during build; refusing to publish an out-of-date PDF" >&2
              exit 1
            fi
            git reset --hard origin/main
            tar -xzf /tmp/mars-lora-generated-output.tgz
            git add results/raw paper/figures paper/paper.pdf
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: verified seeded simulation and compiled manuscript [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo "Unable to publish generated paper and results after retries" >&2
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mars-lora-paper-and-results
          path: |
            paper/paper.pdf
            paper/figures/*.pdf
            results/raw/*
            public/results.json
