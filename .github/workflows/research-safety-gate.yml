name: Research safety scoring regression
on:
  push:
    paths:
      - 'mars_lora/research_gate.py'
      - 'experiments/imu3d_replanning_audit.py'
      - 'tests/test_research_gate.py'
      - '.github/workflows/research-safety-gate.yml'
  pull_request:
    paths:
      - 'mars_lora/research_gate.py'
      - 'experiments/imu3d_replanning_audit.py'
      - 'tests/test_research_gate.py'
      - '.github/workflows/research-safety-gate.yml'
permissions:
  contents: read
jobs:
  invariant-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_research_gate.py -v
