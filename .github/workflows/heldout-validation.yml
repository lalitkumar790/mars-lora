name: Held-out RF-model robustness audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/heldout_validation.py'
      - 'experiments/replay_mujoco_radio.py'
      - 'tests/test_heldout_validation.py'
      - '.github/workflows/heldout-validation.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-heldout-validation
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install plotting tools
        run: python -m pip install matplotlib==3.10.3
      - name: Check independent fading and channel stress invariants
        run: python -m unittest tests.test_heldout_validation -v
      - name: Execute five held-out propagation scenarios
        run: python -m experiments.heldout_validation --input results/rf_navigation --output results/heldout_validation --seeds 20
      - name: Draw actual propagation sensitivity figure
        run: python analysis/plot_heldout.py --input results/heldout_validation/paired_robustness.csv --output paper/figures/heldout_robustness.pdf
      - name: Install IEEE manuscript compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-recommended texlive-publishers poppler-utils
      - name: Compile updated paper with eight-page limit
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error paper.tex
          pages=$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')
          echo "Pages including references: $pages"
          test "$pages" -le 8
      - name: Save data and figures to GitHub only (PDF provided as workflow artifact)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp paper/paper.pdf /tmp/heldout-built-paper.pdf
          tar -czf /tmp/heldout-verified-output.tgz results/heldout_validation paper/figures/heldout_robustness.pdf paper/figures/heldout_robustness.png
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/heldout-verified-output.tgz
            git add results/heldout_validation paper/figures/heldout_robustness.pdf paper/figures/heldout_robustness.png
            if git diff --cached --quiet; then
              cp /tmp/heldout-built-paper.pdf paper/paper.pdf
              exit 0
            fi
            git commit -m 'results: held-out spatial fading and independent LoRa model stress tests [skip ci]'
            if git push origin HEAD:main; then
              cp /tmp/heldout-built-paper.pdf paper/paper.pdf
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: held-out-rf-robustness
          path: |
            results/heldout_validation/*
            paper/figures/heldout_robustness.pdf
            paper/figures/heldout_robustness.png
            paper/paper.pdf
