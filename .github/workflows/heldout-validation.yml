name: Held-out RF-model robustness audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/heldout_validation.py'
      - 'experiments/replay_mujoco_radio.py'
      - 'tests/test_heldout_validation.py'
      - '.github/workflows/heldout-validation.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-heldout-validation
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check independent fading and channel stress invariants
        run: python -m unittest tests.test_heldout_validation -v
      - name: Execute five held-out propagation scenarios
        run: python -m experiments.heldout_validation --input results/rf_navigation --output results/heldout_validation --seeds 20
      - name: Save results to GitHub only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/heldout_validation
          if ! git diff --cached --quiet; then
            git commit -m 'results: held-out spatial fading and independent LoRa model stress tests [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*2))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: held-out-rf-robustness
          path: results/heldout_validation/*
