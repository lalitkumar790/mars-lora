name: Cross-layer propulsion versus radio energy audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/flight_energy_proxy.py'
      - 'tests/test_flight_energy_proxy.py'
      - '.github/workflows/flight-energy.yml'
permissions:
  contents: write
concurrency:
  group: mars-lora-flight-energy
  cancel-in-progress: true
jobs:
  energy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test ideal hover and efficiency assumptions
        run: python -m unittest tests.test_flight_energy_proxy -v
      - name: Compute complete mission-time versus LoRa TX proxy comparison
        run: python -m analysis.flight_energy_proxy
      - name: Commit all assumptions and conservative proxy results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tar -czf /tmp/energy-results.tgz results/flight_energy_proxy
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tar -xzf /tmp/energy-results.tgz
            git add results/flight_energy_proxy
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'results: physics-inspired hover-power and LoRa TX energy comparison [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: illustrative-crosslayer-flight-radio-energy
          path: results/flight_energy_proxy/*
